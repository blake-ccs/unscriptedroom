<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video autoplay test</title>
<style>
  body { margin: 0; background: #2B2728; color: #F3EFE7; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  video { display: block; width: 100%; max-height: 70vh; object-fit: cover; background: #000; }
  p { padding: 0 20px; }
  #status { font-size: 22px; font-weight: 700; padding: 16px 20px 0; }
</style>
</head>
<body>
<!-- Diagnostic only: the plainest possible autoplaying video (no React, no site code). -->
<video id="v" src="/media/hero-shot.mp4" autoplay muted loop playsinline preload="auto"></video>
<div id="status">Checking…</div>
<p id="detail"></p>
<p>This page contains nothing but a muted, autoplaying video. If it shows <b>NOT PLAYING</b> without you clicking anything,
your browser's autoplay setting for this website is blocking it (Safari → Settings → Websites → Auto-Play).</p>
<script>
  var v = document.getElementById("v");
  function show() {
    document.getElementById("status").textContent = v.paused ? "NOT PLAYING (autoplay was blocked)" : "PLAYING automatically ✓";
    document.getElementById("detail").textContent = "readyState=" + v.readyState + ", time=" + v.currentTime.toFixed(1) + "s, muted=" + v.muted + ", " + navigator.userAgent;
  }
  setInterval(show, 500); show();
</script>
</body>
</html>
