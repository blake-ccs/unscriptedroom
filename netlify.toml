# The website lives in web/ (TanStack Start, prerendered to static HTML).
# Paths below are relative to the base directory. Forms post to the Express API on Fly.io (server/).
# Redirects and headers live in web/public/_redirects and web/public/_headers so the built
# folder (web/dist/client) also works as a drag-and-drop deploy.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
